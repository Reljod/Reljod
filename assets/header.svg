<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" role="img" aria-label="Reljod Oreta, AI engineer for banks and financial firms">
  <defs>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#0d1117"/><stop offset=".5" stop-color="#1f6feb"/><stop offset="1" stop-color="#8957e5"/>
    </linearGradient>
  </defs>
  <style>
    .w1{animation:wave 9s ease-in-out infinite alternate}
    .w2{animation:wave 12s ease-in-out infinite alternate-reverse;opacity:.45}
    @keyframes wave{from{transform:translateX(0)}to{transform:translateX(-300px)}}
    .name{animation:fade 1.2s ease-out both}
    .sub{animation:fade 1.2s .5s ease-out both}
    @keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <mask id="c1" maskUnits="userSpaceOnUse" x="0" y="0" width="1200" height="400"><g class="w1"><path fill="#fff" d="M0 0 H1500 V200 Q1350 230 1200 200 T900 200 T600 200 T300 200 T0 200Z"/></g></mask>
  <mask id="c2" maskUnits="userSpaceOnUse" x="0" y="0" width="1200" height="400"><g class="w2"><path fill="#fff" d="M0 0 H1500 V215 Q1350 185 1200 215 T900 215 T600 215 T300 215 T0 215Z"/></g></mask>
  <rect width="1200" height="240" fill="url(#g)" opacity=".45" mask="url(#c2)"/>
  <rect width="1200" height="240" fill="url(#g)" mask="url(#c1)"/>
  <text class="name" x="600" y="98" text-anchor="middle" fill="#fff" font-size="58" font-weight="700">Reljod Oreta</text>
  <text class="sub" x="600" y="140" text-anchor="middle" fill="#e6edf3" font-size="22">AI engineer for banks &amp; financial firms</text>
</svg>
